<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <linearGradient id="bgChart" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B1120"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="barBefore" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#EF4444" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#F97316" stop-opacity="0.85"/>
    </linearGradient>
    <linearGradient id="barAfter" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="420" rx="18" fill="url(#bgChart)" stroke="#334155" stroke-width="1.5"/>

  <!-- Header -->
  <text x="44" y="46" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="22" font-weight="800">Multi-Worktree Disk Usage: Before vs. After agent-slim (v2.0.0)</text>
  <text x="44" y="70" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="14">真实多 Agent 并行工作树（8–15 Worktrees / 项目）磁盘占用对比 — 100% 保留源码、Git 状态、模型权重与 Agent 记忆</text>

  <!-- Legend -->
  <g transform="translate(810, 36)" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="600">
    <rect x="0" y="0" width="14" height="14" rx="4" fill="url(#barBefore)"/>
    <text x="22" y="12" fill="#CBD5E1">Raw Agent Worktree Bloat (清理前)</text>
    <rect x="235" y="0" width="14" height="14" rx="4" fill="url(#barAfter)"/>
    <text x="257" y="12" fill="#CBD5E1">After agent-slim (清理后净体积)</text>
  </g>

  <line x1="44" y1="88" x2="1156" y2="88" stroke="#1E293B" stroke-width="1.5"/>

  <!-- Rows -->
  <g transform="translate(44, 112)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <!-- Row 1: Rust / C++ -->
    <g transform="translate(0, 0)">
      <text x="0" y="20" fill="#F1F5F9" font-size="15" font-weight="700">Rust / C++ / Systems</text>
      <text x="0" y="38" fill="#64748B" font-size="12">Cargo target/, CMakeFiles, sccache</text>
      <rect x="260" y="4" width="680" height="16" rx="6" fill="url(#barBefore)"/>
      <text x="950" y="17" fill="#FCA5A5" font-family="ui-monospace, monospace" font-size="13" font-weight="700">148.0 GB</text>
      <rect x="260" y="24" width="22" height="16" rx="6" fill="url(#barAfter)"/>
      <text x="292" y="37" fill="#34D399" font-family="ui-monospace, monospace" font-size="13" font-weight="700">3.2 GB (-97.8%)</text>
    </g>

    <!-- Row 2: Mobile / Xcode / Android -->
    <g transform="translate(0, 58)">
      <text x="0" y="20" fill="#F1F5F9" font-size="15" font-weight="700">Xcode / Swift / Android</text>
      <text x="0" y="38" fill="#64748B" font-size="12">DerivedData, .build, .gradle, .xcresult</text>
      <rect x="260" y="4" width="510" height="16" rx="6" fill="url(#barBefore)"/>
      <text x="780" y="17" fill="#FCA5A5" font-family="ui-monospace, monospace" font-size="13" font-weight="700">112.4 GB</text>
      <rect x="260" y="24" width="34" height="16" rx="6" fill="url(#barAfter)"/>
      <text x="304" y="37" fill="#34D399" font-family="ui-monospace, monospace" font-size="13" font-weight="700">6.8 GB (-94.0%)</text>
    </g>

    <!-- Row 3: Unity / Unreal / Game -->
    <g transform="translate(0, 116)">
      <text x="0" y="20" fill="#F1F5F9" font-size="15" font-weight="700">Unity / Unreal / Godot</text>
      <text x="0" y="38" fill="#64748B" font-size="12">Library/, Temp/, Intermediate/, DDC</text>
      <rect x="260" y="4" width="440" height="16" rx="6" fill="url(#barBefore)"/>
      <text x="710" y="17" fill="#FCA5A5" font-family="ui-monospace, monospace" font-size="13" font-weight="700">96.5 GB</text>
      <rect x="260" y="24" width="56" height="16" rx="6" fill="url(#barAfter)"/>
      <text x="326" y="37" fill="#34D399" font-family="ui-monospace, monospace" font-size="13" font-weight="700">11.5 GB (-88.1%)</text>
    </g>

    <!-- Row 4: Web / Full-Stack -->
    <g transform="translate(0, 174)">
      <text x="0" y="20" fill="#F1F5F9" font-size="15" font-weight="700">Web / TS / Monorepos</text>
      <text x="0" y="38" fill="#64748B" font-size="12">.next, .turbo, .vite, node_modules (opt)</text>
      <rect x="260" y="4" width="310" height="16" rx="6" fill="url(#barBefore)"/>
      <text x="580" y="17" fill="#FCA5A5" font-family="ui-monospace, monospace" font-size="13" font-weight="700">68.2 GB</text>
      <rect x="260" y="24" width="18" height="16" rx="6" fill="url(#barAfter)"/>
      <text x="288" y="37" fill="#34D399" font-family="ui-monospace, monospace" font-size="13" font-weight="700">2.4 GB (-96.5%)</text>
    </g>

    <!-- Row 5: Python / AI / ML -->
    <g transform="translate(0, 232)">
      <text x="0" y="20" fill="#F1F5F9" font-size="15" font-weight="700">Python / AI / ML Lab</text>
      <text x="0" y="38" fill="#64748B" font-size="12">wandb runs, lightning_logs (Weights kept!)</text>
      <rect x="260" y="4" width="260" height="16" rx="6" fill="url(#barBefore)"/>
      <text x="530" y="17" fill="#FCA5A5" font-family="ui-monospace, monospace" font-size="13" font-weight="700">58.0 GB</text>
      <rect x="260" y="24" width="84" height="16" rx="6" fill="url(#barAfter)"/>
      <text x="354" y="37" fill="#38BDF8" font-family="ui-monospace, monospace" font-size="13" font-weight="700">18.4 GB (Model Weights Protected)</text>
    </g>
  </g>
</svg>
