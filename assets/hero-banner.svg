<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 440" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090D16"/>
      <stop offset="50%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#131C31"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="50%" stop-color="#818CF8"/>
      <stop offset="100%" stop-color="#C084FC"/>
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0.95"/>
    </linearGradient>
    <radialGradient id="glowLeft" cx="20%" cy="25%" r="45%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowRight" cx="82%" cy="70%" r="45%">
      <stop offset="0%" stop-color="#A855F7" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#A855F7" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M 36 0 L 0 0 0 36" fill="none" stroke="#334155" stroke-width="0.6" stroke-opacity="0.3"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1200" height="440" rx="20" fill="url(#bgGrad)"/>
  <rect width="1200" height="440" rx="20" fill="url(#grid)"/>
  <rect width="1200" height="440" rx="20" fill="url(#glowLeft)"/>
  <rect width="1200" height="440" rx="20" fill="url(#glowRight)"/>
  <rect x="1" y="1" width="1198" height="438" rx="19" fill="none" stroke="#334155" stroke-width="1.5" stroke-opacity="0.7"/>

  <!-- Left Column: Brand & Value Proposition -->
  <g transform="translate(56, 52)">
    <!-- Pill Badge -->
    <rect x="0" y="0" width="328" height="30" rx="15" fill="#1E293B" stroke="#38BDF8" stroke-width="1" stroke-opacity="0.5"/>
    <circle cx="18" cy="15" r="5" fill="#10B981"/>
    <text x="32" y="20" fill="#E2E8F0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, sans-serif" font-size="12.5" font-weight="600" letter-spacing="0.4">v2.0.0 · CLI + UNIVERSAL AI AGENT SKILL</text>

    <!-- Title -->
    <text x="0" y="92" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="56" font-weight="800" letter-spacing="-1.2">agent-slim</text>
    <rect x="302" y="54" width="88" height="32" rx="8" fill="url(#accentGrad)" opacity="0.18"/>
    <rect x="302" y="54" width="88" height="32" rx="8" fill="none" stroke="url(#accentGrad)" stroke-width="1.2"/>
    <text x="346" y="75" text-anchor="middle" fill="#38BDF8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" font-weight="700">ZERO-DEP</text>

    <!-- Subtitle -->
    <text x="0" y="132" fill="url(#accentGrad)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="21" font-weight="700">Universal AI Agent &amp; Multi-Stack Workspace Deep Cleaner</text>
    <text x="0" y="162" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="500">面向所有开发者与全栈 AI 编程智能体的通用工作区深度瘦身引擎（保护 Git 进度与 Agent 记忆）</text>

    <!-- 3 Key Metric Cards -->
    <g transform="translate(0, 194)">
      <rect x="0" y="0" width="188" height="84" rx="12" fill="url(#cardGrad)" stroke="#334155" stroke-width="1"/>
      <text x="18" y="34" fill="#38BDF8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="26" font-weight="800">7 Stacks</text>
      <text x="18" y="56" fill="#CBD5E1" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12.5" font-weight="600">Web · AI/ML · Rust/C++</text>
      <text x="18" y="72" fill="#64748B" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11.5">Mobile · Game · Cloud · Media</text>

      <rect x="202" y="0" width="188" height="84" rx="12" fill="url(#cardGrad)" stroke="#334155" stroke-width="1"/>
      <text x="220" y="34" fill="#10B981" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="26" font-weight="800">5 Layers</text>
      <text x="220" y="56" fill="#CBD5E1" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12.5" font-weight="600">Context-Verified Guard</text>
      <text x="220" y="72" fill="#64748B" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11.5">0 Git / Memory / Weight Loss</text>

      <rect x="404" y="0" width="188" height="84" rx="12" fill="url(#cardGrad)" stroke="#334155" stroke-width="1"/>
      <text x="422" y="34" fill="#C084FC" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="26" font-weight="800">11+ Agents</text>
      <text x="422" y="56" fill="#CBD5E1" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12.5" font-weight="600">Claude · Codex · Cursor</text>
      <text x="422" y="72" fill="#64748B" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11.5">Windsurf · Cline · Aider · Orca</text>
    </g>

    <!-- Bottom Tagline -->
    <g transform="translate(0, 306)">
      <rect x="0" y="0" width="592" height="32" rx="8" fill="#0B1120" stroke="#1E293B" stroke-width="1"/>
      <text x="14" y="21" fill="#10B981" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" font-weight="700">$</text>
      <text x="30" y="21" fill="#E2E8F0" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13">git clone https://github.com/Rem021/agent-slim.git &amp;&amp; ./agent-slim/install.sh</text>
    </g>
  </g>

  <!-- Right Column: Terminal Audit Window -->
  <g transform="translate(684, 46)">
    <rect x="0" y="0" width="464" height="348" rx="14" fill="#090D16" stroke="#334155" stroke-width="1.5"/>
    <!-- Window Header -->
    <rect x="0" y="0" width="464" height="36" rx="14" fill="#1E293B"/>
    <rect x="0" y="20" width="464" height="16" fill="#1E293B"/>
    <circle cx="20" cy="18" r="6" fill="#EF4444"/>
    <circle cx="40" cy="18" r="6" fill="#F59E0B"/>
    <circle cx="60" cy="18" r="6" fill="#10B981"/>
    <text x="232" y="22" text-anchor="middle" fill="#94A3B8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600">agent-slim — Multi-Worktree Audit</text>

    <!-- Terminal Lines -->
    <g transform="translate(20, 58)" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12.5">
      <text x="0" y="0" fill="#38BDF8" font-weight="700">$ agent-slim ~/Projects /Volumes/Worktrees</text>
      <text x="0" y="24" fill="#94A3B8">[SCAN] 18 repos · 64 AI agent worktrees</text>
      <text x="0" y="46" fill="#10B981">✓ Guardrail L1: .git &amp; dirty worktrees protected</text>
      <text x="0" y="68" fill="#10B981">✓ Guardrail L2: .claude/.codex/.cursor/AGENTS.md safe</text>
      <text x="0" y="90" fill="#10B981">✓ Guardrail L4: Sibling manifest verified (Cargo/Next)</text>
      <text x="0" y="112" fill="#10B981">✓ Guardrail L5: .safetensors / .gguf weights retained</text>

      <line x1="0" y1="126" x2="424" y2="126" stroke="#1E293B" stroke-width="1.5"/>

      <text x="0" y="148" fill="#E2E8F0" font-weight="700">CATEGORY                         RECLAIMABLE</text>
      <text x="0" y="170" fill="#CBD5E1">Rust/C++ (target/, CMakeFiles)     <tspan fill="#38BDF8" font-weight="700">142.80 GB</tspan></text>
      <text x="0" y="190" fill="#CBD5E1">Xcode/Mobile (DerivedData/.build)  <tspan fill="#38BDF8" font-weight="700"> 98.40 GB</tspan></text>
      <text x="0" y="210" fill="#CBD5E1">Web/Full-Stack (.next/.turbo)      <tspan fill="#38BDF8" font-weight="700"> 54.15 GB</tspan></text>
      <text x="0" y="230" fill="#CBD5E1">Python/ML (wandb/lightning_logs)   <tspan fill="#38BDF8" font-weight="700"> 39.60 GB</tspan></text>
      <text x="0" y="250" fill="#CBD5E1">SHA-256 Scratch Dedup (&gt;=25MB)     <tspan fill="#38BDF8" font-weight="700"> 28.95 GB</tspan></text>

      <rect x="0" y="264" width="424" height="28" rx="6" fill="#064E3B" fill-opacity="0.55" stroke="#10B981" stroke-width="1"/>
      <text x="12" y="283" fill="#34D399" font-weight="700">TOTAL RECLAIMABLE: 363.90 GB (Dry-Run Safe Mode)</text>
    </g>
  </g>
</svg>
