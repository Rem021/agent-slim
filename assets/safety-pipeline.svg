<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bgPipe" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B1120"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="cardSafe" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#064E3B" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="cardVerify" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E1B4B" stop-opacity="0.65"/>
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0.9"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="300" rx="18" fill="url(#bgPipe)" stroke="#334155" stroke-width="1.5"/>

  <text x="40" y="42" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="20" font-weight="800">5-Layer Deterministic Safety Pipeline · 五层确定性安全护栏架构</text>
  <text x="40" y="64" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="13.5">Every directory &amp; artifact passes through 5 strict verification gates before it can ever be marked reclaimable</text>

  <!-- 5 Stage Cards -->
  <g transform="translate(36, 86)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <!-- L1 -->
    <g transform="translate(0, 0)">
      <rect width="208" height="176" rx="12" fill="url(#cardSafe)" stroke="#10B981" stroke-width="1.2"/>
      <rect x="16" y="16" width="68" height="22" rx="6" fill="#10B981" fill-opacity="0.2"/>
      <text x="50" y="31" text-anchor="middle" fill="#34D399" font-size="11.5" font-weight="800">LAYER 1</text>
      <text x="16" y="62" fill="#FFFFFF" font-size="15.5" font-weight="700">VCS &amp; Code Guard</text>
      <text x="16" y="84" fill="#94A3B8" font-size="12">版本控制与未提交代码保护</text>
      <text x="16" y="114" fill="#CBD5E1" font-family="ui-monospace, monospace" font-size="11.5">• .git / .svn / .hg / .jj</text>
      <text x="16" y="134" fill="#CBD5E1" font-family="ui-monospace, monospace" font-size="11.5">• Cargo.lock / uv.lock</text>
      <text x="16" y="154" fill="#CBD5E1" font-family="ui-monospace, monospace" font-size="11.5">• pnpm-lock / Podfile.lock</text>
    </g>

    <!-- Arrow 1 -->
    <path d="M 214 88 L 226 88" stroke="#475569" stroke-width="2" stroke-linecap="round"/>

    <!-- L2 -->
    <g transform="translate(232, 0)">
      <rect width="208" height="176" rx="12" fill="url(#cardSafe)" stroke="#10B981" stroke-width="1.2"/>
      <rect x="16" y="16" width="68" height="22" rx="6" fill="#10B981" fill-opacity="0.2"/>
      <text x="50" y="31" text-anchor="middle" fill="#34D399" font-size="11.5" font-weight="800">LAYER 2</text>
      <text x="16" y="62" fill="#FFFFFF" font-size="15.5" font-weight="700">Agent Memory</text>
      <text x="16" y="84" fill="#94A3B8" font-size="12">全行业 AI 智能体记忆保护</text>
      <text x="16" y="114" fill="#CBD5E1" font-family="ui-monospace, monospace" font-size="11.5">• .claude / .codex / .cursor</text>
      <text x="16" y="134" fill="#CBD5E1" font-family="ui-monospace, monospace" font-size="11.5">• AGENTS.md / MEMORY.md</text>
      <text x="16" y="154" fill="#CBD5E1" font-family="ui-monospace, monospace" font-size="11.5">• docs/ / reports/ / specs/</text>
    </g>

    <!-- Arrow 2 -->
    <path d="M 446 88 L 458 88" stroke="#475569" stroke-width="2" stroke-linecap="round"/>

    <!-- L3 -->
    <g transform="translate(464, 0)">
      <rect width="208" height="176" rx="12" fill="url(#cardVerify)" stroke="#F59E0B" stroke-width="1.2"/>
      <rect x="16" y="16" width="68" height="22" rx="6" fill="#F59E0B" fill-opacity="0.2"/>
      <text x="50" y="31" text-anchor="middle" fill="#FBBF24" font-size="11.5" font-weight="800">LAYER 3</text>
      <text x="16" y="62" fill="#FFFFFF" font-size="15.5" font-weight="700">Active Build Gate</text>
      <text x="16" y="84" fill="#94A3B8" font-size="12">活跃编译与运行任务避让</text>
      <text x="16" y="114" fill="#CBD5E1" font-family="ui-monospace, monospace" font-size="11.5">• --min-age-hours H</text>
      <text x="16" y="134" fill="#CBD5E1" font-family="ui-monospace, monospace" font-size="11.5">• Mtime subtree inspection</text>
      <text x="16" y="154" fill="#CBD5E1" font-family="ui-monospace, monospace" font-size="11.5">• Zero running build abort</text>
    </g>

    <!-- Arrow 3 -->
    <path d="M 678 88 L 690 88" stroke="#475569" stroke-width="2" stroke-linecap="round"/>

    <!-- L4 -->
    <g transform="translate(696, 0)">
      <rect width="208" height="176" rx="12" fill="url(#cardVerify)" stroke="#818CF8" stroke-width="1.2"/>
      <rect x="16" y="16" width="68" height="22" rx="6" fill="#818CF8" fill-opacity="0.2"/>
      <text x="50" y="31" text-anchor="middle" fill="#A5B4FC" font-size="11.5" font-weight="800">LAYER 4</text>
      <text x="16" y="62" fill="#FFFFFF" font-size="15.5" font-weight="700">Sibling Manifest</text>
      <text x="16" y="84" fill="#94A3B8" font-size="12">同级工程配置文件双重核验</text>
      <text x="16" y="114" fill="#CBD5E1" font-family="ui-monospace, monospace" font-size="11.5">• target/ ⇐ Cargo.toml</text>
      <text x="16" y="134" fill="#CBD5E1" font-family="ui-monospace, monospace" font-size="11.5">• build/  ⇐ build.gradle</text>
      <text x="16" y="154" fill="#CBD5E1" font-family="ui-monospace, monospace" font-size="11.5">• Library/⇐ ProjectSettings</text>
    </g>

    <!-- Arrow 4 -->
    <path d="M 910 88 L 922 88" stroke="#475569" stroke-width="2" stroke-linecap="round"/>

    <!-- L5 -->
    <g transform="translate(928, 0)">
      <rect width="200" height="176" rx="12" fill="url(#cardSafe)" stroke="#38BDF8" stroke-width="1.2"/>
      <rect x="16" y="16" width="68" height="22" rx="6" fill="#38BDF8" fill-opacity="0.2"/>
      <text x="50" y="31" text-anchor="middle" fill="#38BDF8" font-size="11.5" font-weight="800">LAYER 5</text>
      <text x="16" y="62" fill="#FFFFFF" font-size="15.5" font-weight="700">Weights &amp; Assets</text>
      <text x="16" y="84" fill="#94A3B8" font-size="12">模型权重与引用图谱保护</text>
      <text x="16" y="114" fill="#CBD5E1" font-family="ui-monospace, monospace" font-size="11.5">• .safetensors / .gguf / .pt</text>
      <text x="16" y="134" fill="#CBD5E1" font-family="ui-monospace, monospace" font-size="11.5">• .fcpxml &amp; JSON pointers</text>
      <text x="16" y="154" fill="#CBD5E1" font-family="ui-monospace, monospace" font-size="11.5">• --keep-versions Top N</text>
    </g>
  </g>
</svg>
